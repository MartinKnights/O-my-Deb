# Omivoid AI configuration — portable defaults
# docs/12-configuration-layout.md, docs/ai/10 §9, docs/ai/02 §16
#
# Provider selection for generic AI actions (ai.ask). Users may override
# through ~/.config/omivoid/ai.toml (user configuration wins).
#
# Values established by the AI environment audit
# (docs/implementation/ai-environment-audit.md).

[ai]
default_provider = "pi"

[ai.providers.pi]
enabled = true

[ai.providers.ollama]
enabled = true
model = "gemma3:4b"