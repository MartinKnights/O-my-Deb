# Ominty application roles — Debian defaults
# docs/12-configuration-layout.md §6, docs/03-action-registry-spec.md §26
#
# Application actions resolve roles rather than hard-coded executables.
# Values below are Debian-available defaults; users may override through
# ~/.config/ominty/apps.toml (user configuration wins).

[apps]
terminal = "alacritty"
browser = "firefox-esr"
files = "nemo"
editor = "nvim"
notes = "obsidian"
mail = "thunderbird"